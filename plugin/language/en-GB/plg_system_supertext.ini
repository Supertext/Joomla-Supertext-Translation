PLG_SYSTEM_SUPERTEXT="System - Supertext Translation"
PLG_SYSTEM_SUPERTEXT_XML_DESCRIPTION="Translate articles into your site's other languages with Supertext AI translation. Adds a <strong>Supertext</strong> button to the Articles list and the article editor; translations are saved as linked (associated) articles for review."

PLG_SYSTEM_SUPERTEXT_API_KEY="Supertext API key"
PLG_SYSTEM_SUPERTEXT_API_KEY_DESC="No Supertext account yet? <a href='https://www.supertext.com/person/en/account/signin' target='_blank' rel='noopener'>Create one at supertext.com</a>. Generate your API key at <a href='https://www.supertext.com/en/integrations/api' target='_blank' rel='noopener'>supertext.com → Integrations → API</a> (requires the Admin role in your Supertext account). You can paste it with or without the leading <code>Supertext-Auth-Key</code>. The SUPERTEXT_API_KEY environment variable takes precedence."
PLG_SYSTEM_SUPERTEXT_TEST_LABEL="API key check"
PLG_SYSTEM_SUPERTEXT_TEST_BUTTON="Test connection"
PLG_SYSTEM_SUPERTEXT_TEST_DESC="Checks the saved key again with a cost-free call to Supertext. The check also runs every time you save these settings."
PLG_SYSTEM_SUPERTEXT_ENV_KEY_ACTIVE="The key from the SUPERTEXT_API_KEY environment variable is used; the field above is ignored."
PLG_SYSTEM_SUPERTEXT_ENVIRONMENT="API environment"
PLG_SYSTEM_SUPERTEXT_ENVIRONMENT_LIVE="Live"
PLG_SYSTEM_SUPERTEXT_ENVIRONMENT_STAGING="Staging"
PLG_SYSTEM_SUPERTEXT_ENVIRONMENT_TESTING="Testing"
PLG_SYSTEM_SUPERTEXT_ENDPOINT="Custom API base URL"
PLG_SYSTEM_SUPERTEXT_ENDPOINT_DESC="Optional. Overrides the environment, e.g. for a test server. The SUPERTEXT_API_ENDPOINT environment variable takes precedence."
PLG_SYSTEM_SUPERTEXT_TARGET_STATE="Status of new translations"
PLG_SYSTEM_SUPERTEXT_TARGET_STATE_DESC="Unpublished lets an editor review translations before they go live."
PLG_SYSTEM_SUPERTEXT_CUSTOM_FIELDS="Translate custom fields"
PLG_SYSTEM_SUPERTEXT_CUSTOM_FIELDS_DESC="Translate Text, Textarea and Editor custom fields. Other custom fields are copied unchanged."
PLG_SYSTEM_SUPERTEXT_FIELDSET_LANGUAGES="Languages"
PLG_SYSTEM_SUPERTEXT_FIELDSET_LANGUAGES_DESC="Each content language needs a Supertext language. A content language whose tag is a Supertext code (de-CH, fr-FR, it-IT, en-GB) is used as it is; for all others (e.g. es-ES, nl-NL, zh-CN) add a row and choose its Supertext language (Spanish — es, Dutch — nl, Chinese (Simplified) — zh-Hans). A row can also send another code (e.g. fr-CH for Swiss French) or choose formal or informal language."
PLG_SYSTEM_SUPERTEXT_LANGUAGES="Language settings"
PLG_SYSTEM_SUPERTEXT_LANGUAGE_CODE="Supertext language"
PLG_SYSTEM_SUPERTEXT_POLITENESS="Tone"
PLG_SYSTEM_SUPERTEXT_POLITENESS_DEFAULT="Default"
PLG_SYSTEM_SUPERTEXT_POLITENESS_MORE="Formal (Sie, vous)"
PLG_SYSTEM_SUPERTEXT_POLITENESS_LESS="Informal (du, tu)"
PLG_SYSTEM_SUPERTEXT_POLL_TIMEOUT="Timeout (seconds)"
PLG_SYSTEM_SUPERTEXT_POLL_TIMEOUT_DESC="Maximum time to wait for one translation."
PLG_SYSTEM_SUPERTEXT_POLL_INTERVAL="Status check interval (seconds)"
PLG_SYSTEM_SUPERTEXT_VERSION_REPORTS="Send version information to Supertext"
PLG_SYSTEM_SUPERTEXT_VERSION_REPORTS_DESC="Sends the site URL and the versions of this plugin, Joomla and the runtime to Supertext when you save these settings and after an update, so Supertext support can see which version you run. No content, no API key and no personal data are sent."
PLG_SYSTEM_SUPERTEXT_VERSION_REPORTS_ENV_OFF="Turned off on this server by the environment variable SUPERTEXT_VERSION_REPORTS=%s: nothing is sent, whatever this setting says."
PLG_SYSTEM_SUPERTEXT_VERSION_REPORTS_ENV_ON="Turned on on this server by the environment variable SUPERTEXT_VERSION_REPORTS=%s, whatever this setting says."
PLG_SYSTEM_SUPERTEXT_VERSION_REPORTS_PING="Supertext checks that the site can be reached at %s (the answer contains only the plugin's name)."
PLG_SYSTEM_SUPERTEXT_KEYCHECK_OK="API key checked: the connection to Supertext works."
PLG_SYSTEM_SUPERTEXT_KEYCHECK_INVALID="Supertext rejected the API key. Check that you copied the whole key, or generate a new one at <a href='https://www.supertext.com/en/integrations/api' target='_blank' rel='noopener'>supertext.com → Integrations → API</a> (requires the Admin role). No Supertext account yet? Create one at <a href='https://www.supertext.com/person/en/account/signin' target='_blank' rel='noopener'>supertext.com</a>."
PLG_SYSTEM_SUPERTEXT_KEYCHECK_MISSING="No API key is set yet. No Supertext account yet? Create one at <a href='https://www.supertext.com/person/en/account/signin' target='_blank' rel='noopener'>supertext.com</a>. Generate your API key at <a href='https://www.supertext.com/en/integrations/api' target='_blank' rel='noopener'>supertext.com → Integrations → API</a> (requires the Admin role)."
PLG_SYSTEM_SUPERTEXT_KEYCHECK_UNREACHABLE="The API key couldn't be checked because Supertext can't be reached. The settings are saved; check again later."
