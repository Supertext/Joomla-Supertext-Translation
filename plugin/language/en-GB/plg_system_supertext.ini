PLG_SYSTEM_SUPERTEXT_XML_DESCRIPTION="Translate articles into your site's other languages with Supertext AI translation. Adds a <strong>Supertext</strong> button to the Articles list and the article editor; translations are saved as linked (associated) articles for review."

