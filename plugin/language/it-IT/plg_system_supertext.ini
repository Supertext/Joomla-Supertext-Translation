PLG_SYSTEM_SUPERTEXT_ENDPOINT_DESC="Facoltativo. Sostituisce l'ambiente, ad es. per un server di test. La variabile d'ambiente SUPERTEXT_API_ENDPOINT ha la precedenza."
PLG_SYSTEM_SUPERTEXT_TARGET_STATE="Stato delle nuove traduzioni"
PLG_SYSTEM_SUPERTEXT_TARGET_STATE_DESC="Con «Non pubblicato» un redattore può revisionare le traduzioni prima della pubblicazione."
PLG_SYSTEM_SUPERTEXT_CUSTOM_FIELDS="Traduci campi personalizzati"
PLG_SYSTEM_SUPERTEXT_CUSTOM_FIELDS_DESC="Traduce i campi personalizzati di tipo Testo, Area di testo ed Editor. Gli altri campi personalizzati vengono copiati invariati."
PLG_SYSTEM_SUPERTEXT_FIELDSET_LANGUAGES="Lingue"
PLG_SYSTEM_SUPERTEXT_FIELDSET_LANGUAGES_DESC="Facoltativo. Per impostazione predefinita il codice di ogni lingua del contenuto (ad es. fr-FR) viene inviato a Supertext come lingua di destinazione. Aggiunga una riga per inviare un codice diverso (ad es. fr-CH per il francese svizzero) o per scegliere un tono formale o informale."
