PLG_SYSTEM_SUPERTEXT="System - Supertext Translation"
PLG_SYSTEM_SUPERTEXT_XML_DESCRIPTION="Traduce gli articoli nelle altre lingue del sito con la traduzione IA di Supertext. Aggiunge il pulsante <strong>Supertext</strong> all'elenco articoli e all'editor degli articoli; le traduzioni vengono salvate come articoli associati, da revisionare."

PLG_SYSTEM_SUPERTEXT_API_KEY="Chiave API Supertext"
PLG_SYSTEM_SUPERTEXT_API_KEY_DESC="Non ha ancora un account Supertext? <a href='https://www.supertext.com/person/en/account/signin' target='_blank' rel='noopener'>Ne crei uno su supertext.com</a>. Generi la Sua chiave API su <a href='https://www.supertext.com/en/integrations/api' target='_blank' rel='noopener'>supertext.com → Integrations → API</a> (richiede il ruolo Admin nel Suo account Supertext). Può incollarla con o senza il prefisso <code>Supertext-Auth-Key</code>. La variabile d'ambiente SUPERTEXT_API_KEY ha la precedenza."
PLG_SYSTEM_SUPERTEXT_TEST_LABEL="Verifica della chiave API"
PLG_SYSTEM_SUPERTEXT_TEST_BUTTON="Verifica connessione"
PLG_SYSTEM_SUPERTEXT_TEST_DESC="Verifica di nuovo la chiave salvata con una chiamata gratuita a Supertext. La verifica viene eseguita anche ogni volta che salva queste impostazioni."
PLG_SYSTEM_SUPERTEXT_ENV_KEY_ACTIVE="Viene usata la chiave della variabile d'ambiente SUPERTEXT_API_KEY; il campo qui sopra viene ignorato."
PLG_SYSTEM_SUPERTEXT_ENVIRONMENT="Ambiente API"
PLG_SYSTEM_SUPERTEXT_ENVIRONMENT_LIVE="Produzione"
PLG_SYSTEM_SUPERTEXT_ENVIRONMENT_STAGING="Staging"
PLG_SYSTEM_SUPERTEXT_ENVIRONMENT_TESTING="Test"
PLG_SYSTEM_SUPERTEXT_ENDPOINT="URL di base API personalizzato"
PLG_SYSTEM_SUPERTEXT_ENDPOINT_DESC="Facoltativo. Sostituisce l'ambiente, ad es. per un server di test. La variabile d'ambiente SUPERTEXT_API_ENDPOINT ha la precedenza."
PLG_SYSTEM_SUPERTEXT_TARGET_STATE="Stato delle nuove traduzioni"
PLG_SYSTEM_SUPERTEXT_TARGET_STATE_DESC="Con «Non pubblicato» un redattore può revisionare le traduzioni prima della pubblicazione."
PLG_SYSTEM_SUPERTEXT_CUSTOM_FIELDS="Traduci campi personalizzati"
PLG_SYSTEM_SUPERTEXT_CUSTOM_FIELDS_DESC="Traduce i campi personalizzati di tipo Testo, Area di testo ed Editor. Gli altri campi personalizzati vengono copiati invariati."
PLG_SYSTEM_SUPERTEXT_FIELDSET_LANGUAGES="Lingue"
PLG_SYSTEM_SUPERTEXT_FIELDSET_LANGUAGES_DESC="Scelga la lingua Supertext per ogni lingua del contenuto. La stessa scelta vale in entrambe le direzioni: per tradurre verso questa lingua e da essa. Ogni elenco propone già il codice suggerito (de-DE per il tedesco, es per lo spagnolo, zh-Hans per il cinese (Cina)); lo modifichi se desidera un'altra variante, ad es. fr-CH per il francese svizzero. Una lingua senza suggerimento (ad es. en-IE, gsw) mostra «— scegliere —» e non può essere tradotta finché non sceglie una lingua Supertext. Il tono (formale o informale) viene proposto solo dove Supertext lo offre."
PLG_SYSTEM_SUPERTEXT_LANGUAGE_CODE="Lingua Supertext"
PLG_SYSTEM_SUPERTEXT_LANGUAGE_CHOOSE="— scegliere —"
PLG_SYSTEM_SUPERTEXT_POLITENESS="Tono"
PLG_SYSTEM_SUPERTEXT_POLITENESS_DEFAULT="Predefinito"
PLG_SYSTEM_SUPERTEXT_POLITENESS_MORE="Formale (Sie, vous)"
PLG_SYSTEM_SUPERTEXT_POLITENESS_LESS="Informale (du, tu)"
PLG_SYSTEM_SUPERTEXT_POLL_TIMEOUT="Timeout (secondi)"
PLG_SYSTEM_SUPERTEXT_POLL_TIMEOUT_DESC="Tempo massimo di attesa per una traduzione."
PLG_SYSTEM_SUPERTEXT_POLL_INTERVAL="Intervallo di verifica dello stato (secondi)"
PLG_SYSTEM_SUPERTEXT_VERSION_REPORTS="Inviare le informazioni sulla versione a Supertext"
PLG_SYSTEM_SUPERTEXT_VERSION_REPORTS_DESC="Invia a Supertext l'URL del sito e le versioni di questo plugin, di Joomla e dell'ambiente di esecuzione quando salva queste impostazioni e dopo un aggiornamento. In questo modo l'assistenza Supertext vede quale versione utilizza. Non vengono trasmessi contenuti, chiavi API né dati personali."
PLG_SYSTEM_SUPERTEXT_VERSION_REPORTS_ENV_OFF="Disattivato su questo server dalla variabile d'ambiente SUPERTEXT_VERSION_REPORTS=%s: non viene inviato nulla, indipendentemente da questa impostazione."
PLG_SYSTEM_SUPERTEXT_VERSION_REPORTS_ENV_ON="Attivato su questo server dalla variabile d'ambiente SUPERTEXT_VERSION_REPORTS=%s, indipendentemente da questa impostazione."
PLG_SYSTEM_SUPERTEXT_VERSION_REPORTS_PING="Supertext verifica che il sito sia raggiungibile all'indirizzo %s (la risposta contiene solo il nome del plugin)."
PLG_SYSTEM_SUPERTEXT_KEYCHECK_OK="Chiave API verificata: la connessione a Supertext funziona."
PLG_SYSTEM_SUPERTEXT_KEYCHECK_INVALID="Supertext ha rifiutato la chiave API. Verifichi di aver copiato l'intera chiave oppure ne generi una nuova su <a href='https://www.supertext.com/en/integrations/api' target='_blank' rel='noopener'>supertext.com → Integrations → API</a> (richiede il ruolo Admin). Non ha ancora un account Supertext? Ne crei uno su <a href='https://www.supertext.com/person/en/account/signin' target='_blank' rel='noopener'>supertext.com</a>."
PLG_SYSTEM_SUPERTEXT_KEYCHECK_MISSING="Non è ancora stata inserita alcuna chiave API. Non ha ancora un account Supertext? Ne crei uno su <a href='https://www.supertext.com/person/en/account/signin' target='_blank' rel='noopener'>supertext.com</a>. Generi la Sua chiave API su <a href='https://www.supertext.com/en/integrations/api' target='_blank' rel='noopener'>supertext.com → Integrations → API</a> (richiede il ruolo Admin)."
PLG_SYSTEM_SUPERTEXT_KEYCHECK_UNREACHABLE="Non è stato possibile verificare la chiave API perché Supertext non è raggiungibile. Le impostazioni sono salvate; riprovi più tardi."
PLG_SYSTEM_SUPERTEXT_KEYCHECK_ERROR="Non è stato possibile verificare la chiave API: Supertext ha risposto con un errore (%s). Le impostazioni sono salvate; riprovi più tardi."
PLG_SYSTEM_SUPERTEXT_KEYCHECK_CHECKED_AT="verificata il %s"
PLG_SYSTEM_SUPERTEXT_KEYCHECK_NOT_CHECKED="Non ancora verificata. Salvi le impostazioni o clicchi su «Verifica connessione»."
PLG_SYSTEM_SUPERTEXT_LANGUAGE_GSW_U_SD_CHZH="tedesco svizzero (Zurigo)"
PLG_SYSTEM_SUPERTEXT_LANGUAGE_GSW_U_SD_CHBE="tedesco svizzero (Berna)"
PLG_SYSTEM_SUPERTEXT_LANGUAGE_STATUS_LANGUAGE="Lingua del contenuto"
PLG_SYSTEM_SUPERTEXT_LANGUAGE_STATUS_NONE="Ancora nessuna lingua del contenuto. Le crei in Sistema → Gestione → Lingue dei contenuti."
PLG_SYSTEM_SUPERTEXT_LANGUAGE_NOT_MAPPED="Scelga una lingua Supertext: fino ad allora questa lingua non può essere tradotta."
PLG_SYSTEM_SUPERTEXT_LANGUAGE_NO_POLITENESS="Supertext non offre un tono formale/informale per questa lingua."

