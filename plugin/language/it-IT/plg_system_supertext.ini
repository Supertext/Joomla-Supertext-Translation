PLG_SYSTEM_SUPERTEXT="System - Supertext Translation"
PLG_SYSTEM_SUPERTEXT_XML_DESCRIPTION="Traduce gli articoli nelle altre lingue del sito con la traduzione IA di Supertext. Aggiunge il pulsante <strong>Supertext</strong> all'elenco articoli e all'editor degli articoli; le traduzioni vengono salvate come articoli associati, da revisionare."

PLG_SYSTEM_SUPERTEXT_API_KEY="Chiave API Supertext"
PLG_SYSTEM_SUPERTEXT_API_KEY_DESC="Non ha ancora un account Supertext? <a href='https://www.supertext.com/person/en/account/signin' target='_blank' rel='noopener'>Ne crei uno su supertext.com</a>. Generi la Sua chiave API su <a href='https://www.supertext.com/en/integrations/api' target='_blank' rel='noopener'>supertext.com → Integrations → API</a> (richiede il ruolo Admin nel Suo account Supertext). Può incollarla con o senza il prefisso <code>Supertext-Auth-Key</code>. La variabile d'ambiente SUPERTEXT_API_KEY ha la precedenza."
PLG_SYSTEM_SUPERTEXT_TEST_LABEL="Connessione"
PLG_SYSTEM_SUPERTEXT_TEST_BUTTON="Verifica connessione"
PLG_SYSTEM_SUPERTEXT_TEST_DESC="Verifica la chiave salvata. Dopo aver modificato la chiave, salvi prima il plugin."
PLG_SYSTEM_SUPERTEXT_TEST_OK="Connesso. La chiave API funziona."
PLG_SYSTEM_SUPERTEXT_ENV_KEY_ACTIVE="Viene usata la chiave della variabile d'ambiente SUPERTEXT_API_KEY; il campo qui sopra viene ignorato."
PLG_SYSTEM_SUPERTEXT_ENVIRONMENT="Ambiente API"
PLG_SYSTEM_SUPERTEXT_ENVIRONMENT_LIVE="Produzione"
