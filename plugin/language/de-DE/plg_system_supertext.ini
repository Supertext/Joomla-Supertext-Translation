PLG_SYSTEM_SUPERTEXT_FIELDSET_LANGUAGES_DESC="Optional. Standardmäßig wird das Sprachkürzel der Inhaltssprache (z. B. fr-FR) als Zielsprache an Supertext gesendet. Mit einer Zeile lässt sich ein anderer Code senden (z. B. fr-CH für Schweizer Französisch) oder die Anrede wählen."
