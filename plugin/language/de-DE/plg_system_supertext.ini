PLG_SYSTEM_SUPERTEXT_TARGET_STATE="Status neuer Übersetzungen"
PLG_SYSTEM_SUPERTEXT_TARGET_STATE_DESC="Mit „Versteckt“ können Übersetzungen vor der Veröffentlichung geprüft werden."
PLG_SYSTEM_SUPERTEXT_CUSTOM_FIELDS="Eigene Felder übersetzen"
PLG_SYSTEM_SUPERTEXT_CUSTOM_FIELDS_DESC="Übersetzt eigene Felder der Typen Text, Textbereich und Editor. Andere eigene Felder werden unverändert kopiert."
