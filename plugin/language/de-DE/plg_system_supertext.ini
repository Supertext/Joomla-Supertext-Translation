PLG_SYSTEM_SUPERTEXT="System - Supertext Translation"
PLG_SYSTEM_SUPERTEXT_XML_DESCRIPTION="Übersetzt Beiträge mit der KI-Übersetzung von Supertext in die anderen Sprachen der Website. Fügt der Beitragsliste und dem Beitragseditor die Schaltfläche <strong>Supertext</strong> hinzu; Übersetzungen werden als verknüpfte (zugeordnete) Beiträge zur Prüfung gespeichert."

PLG_SYSTEM_SUPERTEXT_API_KEY="Supertext-API-Schlüssel"
PLG_SYSTEM_SUPERTEXT_API_KEY_DESC="Noch kein Supertext-Konto? <a href='https://www.supertext.com/person/en/account/signin' target='_blank' rel='noopener'>Jetzt auf supertext.com erstellen</a>. Den API-Schlüssel erzeugen Sie unter <a href='https://www.supertext.com/en/integrations/api' target='_blank' rel='noopener'>supertext.com → Integrations → API</a> (dafür braucht es die Admin-Rolle im Supertext-Konto). Mit oder ohne vorangestelltes <code>Supertext-Auth-Key</code> einfügen. Die Umgebungsvariable SUPERTEXT_API_KEY hat Vorrang."
PLG_SYSTEM_SUPERTEXT_TEST_LABEL="Prüfung des API-Schlüssels"
PLG_SYSTEM_SUPERTEXT_TEST_BUTTON="Verbindung testen"
PLG_SYSTEM_SUPERTEXT_TEST_DESC="Prüft den gespeicherten Schlüssel erneut mit einer kostenlosen Abfrage bei Supertext. Die Prüfung läuft auch jedes Mal, wenn Sie diese Einstellungen speichern."
PLG_SYSTEM_SUPERTEXT_ENV_KEY_ACTIVE="Es wird der Schlüssel aus der Umgebungsvariable SUPERTEXT_API_KEY verwendet; das Feld oben wird ignoriert."
PLG_SYSTEM_SUPERTEXT_ENVIRONMENT="API-Umgebung"
PLG_SYSTEM_SUPERTEXT_ENVIRONMENT_LIVE="Live"
PLG_SYSTEM_SUPERTEXT_ENVIRONMENT_STAGING="Staging"
PLG_SYSTEM_SUPERTEXT_ENVIRONMENT_TESTING="Testing"
PLG_SYSTEM_SUPERTEXT_ENDPOINT="Eigene API-Basis-URL"
PLG_SYSTEM_SUPERTEXT_ENDPOINT_DESC="Optional. Ersetzt die Umgebung, z. B. für einen Testserver. Die Umgebungsvariable SUPERTEXT_API_ENDPOINT hat Vorrang."
PLG_SYSTEM_SUPERTEXT_TARGET_STATE="Status neuer Übersetzungen"
PLG_SYSTEM_SUPERTEXT_TARGET_STATE_DESC="Mit „Versteckt“ können Übersetzungen vor der Veröffentlichung geprüft werden."
PLG_SYSTEM_SUPERTEXT_CUSTOM_FIELDS="Eigene Felder übersetzen"
PLG_SYSTEM_SUPERTEXT_CUSTOM_FIELDS_DESC="Übersetzt eigene Felder der Typen Text, Textbereich und Editor. Andere eigene Felder werden unverändert kopiert."
PLG_SYSTEM_SUPERTEXT_FIELDSET_LANGUAGES="Sprachen"
PLG_SYSTEM_SUPERTEXT_FIELDSET_LANGUAGES_DESC="Wählen Sie für jede Inhaltssprache die Supertext-Sprache. Eine Auswahl gilt für beide Richtungen: für Übersetzungen in die Sprache und aus ihr. Jede Liste ist mit dem vorgeschlagenen Code vorbelegt (de-DE für Deutsch, es für Spanisch, zh-Hans für Chinesisch (China)); ändern Sie ihn, wo Sie eine andere Variante möchten, z. B. fr-CH für Schweizer Französisch. Eine Sprache ohne Vorschlag (z. B. en-IE, gsw) zeigt „— auswählen —“ und lässt sich erst übersetzen, wenn Sie eine Supertext-Sprache wählen. Die Anrede (formell oder informell) wird nur angeboten, wo Supertext sie hat."
PLG_SYSTEM_SUPERTEXT_LANGUAGE_CODE="Supertext-Sprache"
PLG_SYSTEM_SUPERTEXT_LANGUAGE_CHOOSE="— auswählen —"
PLG_SYSTEM_SUPERTEXT_POLITENESS="Anrede"
PLG_SYSTEM_SUPERTEXT_POLITENESS_DEFAULT="Standard"
PLG_SYSTEM_SUPERTEXT_POLITENESS_MORE="Formell (Sie, vous)"
PLG_SYSTEM_SUPERTEXT_POLITENESS_LESS="Informell (du, tu)"
PLG_SYSTEM_SUPERTEXT_POLL_TIMEOUT="Zeitlimit (Sekunden)"
PLG_SYSTEM_SUPERTEXT_POLL_TIMEOUT_DESC="Maximale Wartezeit für eine Übersetzung."
PLG_SYSTEM_SUPERTEXT_POLL_INTERVAL="Abfrageintervall (Sekunden)"
PLG_SYSTEM_SUPERTEXT_VERSION_REPORTS="Versionsinformationen an Supertext senden"
PLG_SYSTEM_SUPERTEXT_VERSION_REPORTS_DESC="Sendet die URL der Website sowie die Versionen dieses Plugins, von Joomla und der Laufzeitumgebung an Supertext, wenn Sie diese Einstellungen speichern und nach einem Update. So sieht der Supertext-Support, welche Version Sie einsetzen. Es werden keine Inhalte, kein API-Schlüssel und keine Personendaten übertragen."
PLG_SYSTEM_SUPERTEXT_VERSION_REPORTS_ENV_OFF="Auf diesem Server mit der Umgebungsvariable SUPERTEXT_VERSION_REPORTS=%s ausgeschaltet: Es wird nichts gesendet, unabhängig von dieser Einstellung."
PLG_SYSTEM_SUPERTEXT_VERSION_REPORTS_ENV_ON="Auf diesem Server mit der Umgebungsvariable SUPERTEXT_VERSION_REPORTS=%s eingeschaltet, unabhängig von dieser Einstellung."
PLG_SYSTEM_SUPERTEXT_VERSION_REPORTS_PING="Supertext prüft unter %s, ob die Website erreichbar ist (die Antwort enthält nur den Namen des Plugins)."
PLG_SYSTEM_SUPERTEXT_KEYCHECK_OK="API-Schlüssel geprüft: Die Verbindung zu Supertext funktioniert."
PLG_SYSTEM_SUPERTEXT_KEYCHECK_INVALID="Supertext hat den API-Schlüssel abgelehnt. Prüfen Sie, ob Sie den ganzen Schlüssel kopiert haben, oder erstellen Sie einen neuen unter <a href='https://www.supertext.com/en/integrations/api' target='_blank' rel='noopener'>supertext.com → Integrations → API</a> (erfordert die Rolle Admin). Noch kein Supertext-Konto? Erstellen Sie eines auf <a href='https://www.supertext.com/person/en/account/signin' target='_blank' rel='noopener'>supertext.com</a>."
PLG_SYSTEM_SUPERTEXT_KEYCHECK_MISSING="Es ist noch kein API-Schlüssel eingetragen. Noch kein Supertext-Konto? Erstellen Sie eines auf <a href='https://www.supertext.com/person/en/account/signin' target='_blank' rel='noopener'>supertext.com</a>. Ihren API-Schlüssel erstellen Sie unter <a href='https://www.supertext.com/en/integrations/api' target='_blank' rel='noopener'>supertext.com → Integrations → API</a> (erfordert die Rolle Admin)."
PLG_SYSTEM_SUPERTEXT_KEYCHECK_UNREACHABLE="Der API-Schlüssel konnte nicht geprüft werden, weil Supertext nicht erreichbar ist. Die Einstellungen sind gespeichert; prüfen Sie ihn später erneut."
PLG_SYSTEM_SUPERTEXT_KEYCHECK_ERROR="Der API-Schlüssel konnte nicht geprüft werden: Supertext hat mit einem Fehler geantwortet (%s). Die Einstellungen sind gespeichert; prüfen Sie ihn später erneut."
PLG_SYSTEM_SUPERTEXT_KEYCHECK_CHECKED_AT="geprüft am %s"
PLG_SYSTEM_SUPERTEXT_KEYCHECK_NOT_CHECKED="Noch nicht geprüft. Speichern Sie die Einstellungen oder klicken Sie auf „Verbindung testen“."
