PLG_SYSTEM_SUPERTEXT="System - Supertext Translation"
PLG_SYSTEM_SUPERTEXT_XML_DESCRIPTION="Übersetzt Beiträge mit der KI-Übersetzung von Supertext in die anderen Sprachen der Website. Fügt der Beitragsliste und dem Beitragseditor die Schaltfläche <strong>Supertext</strong> hinzu; Übersetzungen werden als verknüpfte (zugeordnete) Beiträge zur Prüfung gespeichert."

PLG_SYSTEM_SUPERTEXT_API_KEY="Supertext-API-Schlüssel"
PLG_SYSTEM_SUPERTEXT_API_KEY_DESC="Noch kein Supertext-Konto? <a href='https://www.supertext.com/person/en/account/signin' target='_blank' rel='noopener'>Jetzt auf supertext.com erstellen</a>. Den API-Schlüssel erzeugen Sie unter <a href='https://www.supertext.com/en/integrations/api' target='_blank' rel='noopener'>supertext.com → Integrationen → API</a> (dafür braucht es die Admin-Rolle im Supertext-Konto). Mit oder ohne vorangestelltes <code>Supertext-Auth-Key</code> einfügen. Die Umgebungsvariable SUPERTEXT_API_KEY hat Vorrang."
PLG_SYSTEM_SUPERTEXT_TEST_LABEL="Verbindung"
PLG_SYSTEM_SUPERTEXT_TEST_BUTTON="Verbindung testen"
PLG_SYSTEM_SUPERTEXT_TEST_DESC="Prüft den gespeicherten Schlüssel. Nach dem Ändern des Schlüssels zuerst speichern."
PLG_SYSTEM_SUPERTEXT_TEST_OK="Verbunden. Der API-Schlüssel funktioniert."
PLG_SYSTEM_SUPERTEXT_ENV_KEY_ACTIVE="Es wird der Schlüssel aus der Umgebungsvariable SUPERTEXT_API_KEY verwendet; das Feld oben wird ignoriert."
