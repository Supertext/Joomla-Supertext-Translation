PLG_SYSTEM_SUPERTEXT_LANGUAGE_STATUS_NONE="Aucune langue de contenu pour le moment. Créez-les sous Système → Gestion → Langues de contenu."
PLG_SYSTEM_SUPERTEXT_LANGUAGE_NOT_MAPPED="Choisissez une langue Supertext : d'ici là, cette langue ne peut pas être traduite."
