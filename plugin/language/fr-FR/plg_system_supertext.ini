PLG_SYSTEM_SUPERTEXT="System - Supertext Translation"
PLG_SYSTEM_SUPERTEXT_XML_DESCRIPTION="Traduit les articles dans les autres langues du site avec la traduction IA de Supertext. Ajoute un bouton <strong>Supertext</strong> à la liste des articles et à l'éditeur d'article ; les traductions sont enregistrées comme articles associés, pour relecture."

PLG_SYSTEM_SUPERTEXT_API_KEY="Clé API Supertext"
PLG_SYSTEM_SUPERTEXT_API_KEY_DESC="Pas encore de compte Supertext ? <a href='https://www.supertext.com/person/en/account/signin' target='_blank' rel='noopener'>Créez-en un sur supertext.com</a>. Générez votre clé API sur <a href='https://www.supertext.com/en/integrations/api' target='_blank' rel='noopener'>supertext.com → Integrations → API</a> (rôle Admin requis dans votre compte Supertext). Vous pouvez la coller avec ou sans le préfixe <code>Supertext-Auth-Key</code>. La variable d'environnement SUPERTEXT_API_KEY est prioritaire."
PLG_SYSTEM_SUPERTEXT_TEST_LABEL="Vérification de la clé API"
PLG_SYSTEM_SUPERTEXT_TEST_BUTTON="Tester la connexion"
PLG_SYSTEM_SUPERTEXT_TEST_DESC="Vérifie à nouveau la clé enregistrée par un appel gratuit à Supertext. La vérification s'effectue aussi chaque fois que vous enregistrez ces paramètres."
PLG_SYSTEM_SUPERTEXT_ENV_KEY_ACTIVE="La clé de la variable d'environnement SUPERTEXT_API_KEY est utilisée ; le champ ci-dessus est ignoré."
PLG_SYSTEM_SUPERTEXT_ENVIRONMENT="Environnement de l'API"
PLG_SYSTEM_SUPERTEXT_ENVIRONMENT_LIVE="Production"
PLG_SYSTEM_SUPERTEXT_ENVIRONMENT_STAGING="Préproduction"
PLG_SYSTEM_SUPERTEXT_ENVIRONMENT_TESTING="Test"
PLG_SYSTEM_SUPERTEXT_ENDPOINT="URL de base de l'API personnalisée"
PLG_SYSTEM_SUPERTEXT_ENDPOINT_DESC="Facultatif. Remplace l'environnement, par exemple pour un serveur de test. La variable d'environnement SUPERTEXT_API_ENDPOINT est prioritaire."
PLG_SYSTEM_SUPERTEXT_TARGET_STATE="Statut des nouvelles traductions"
PLG_SYSTEM_SUPERTEXT_TARGET_STATE_DESC="Avec « Dépublié », un rédacteur peut relire les traductions avant leur mise en ligne."
PLG_SYSTEM_SUPERTEXT_CUSTOM_FIELDS="Traduire les champs personnalisés"
PLG_SYSTEM_SUPERTEXT_CUSTOM_FIELDS_DESC="Traduit les champs personnalisés de type Texte, Zone de texte et Éditeur. Les autres champs personnalisés sont copiés tels quels."
PLG_SYSTEM_SUPERTEXT_FIELDSET_LANGUAGES="Langues"
PLG_SYSTEM_SUPERTEXT_FIELDSET_LANGUAGES_DESC="Choisissez la langue Supertext de chaque langue de contenu. Un même choix sert dans les deux sens : pour traduire vers cette langue et depuis celle-ci. Chaque liste propose d'emblée le code suggéré (de-DE pour l'allemand, es pour l'espagnol, zh-Hans pour le chinois (Chine)) ; modifiez-le si vous souhaitez une autre variante, par ex. fr-CH pour le français de Suisse. Une langue sans suggestion (par ex. en-IE, gsw) affiche « — choisir — » et ne peut pas être traduite tant que vous n'avez pas choisi de langue Supertext. Le ton (formel ou informel) n'est proposé que là où Supertext l'offre."
PLG_SYSTEM_SUPERTEXT_LANGUAGE_CODE="Langue Supertext"
PLG_SYSTEM_SUPERTEXT_LANGUAGE_CHOOSE="— choisir —"
PLG_SYSTEM_SUPERTEXT_POLITENESS="Ton"
PLG_SYSTEM_SUPERTEXT_POLITENESS_DEFAULT="Par défaut"
PLG_SYSTEM_SUPERTEXT_POLITENESS_MORE="Formel (Sie, vous)"
PLG_SYSTEM_SUPERTEXT_POLITENESS_LESS="Informel (du, tu)"
PLG_SYSTEM_SUPERTEXT_POLL_TIMEOUT="Délai d'attente (secondes)"
PLG_SYSTEM_SUPERTEXT_POLL_TIMEOUT_DESC="Durée maximale d'attente pour une traduction."
PLG_SYSTEM_SUPERTEXT_POLL_INTERVAL="Intervalle de vérification du statut (secondes)"
PLG_SYSTEM_SUPERTEXT_VERSION_REPORTS="Envoyer les informations de version à Supertext"
PLG_SYSTEM_SUPERTEXT_VERSION_REPORTS_DESC="Envoie à Supertext l'URL du site ainsi que les versions de ce plugin, de Joomla et de l'environnement d'exécution lorsque vous enregistrez ces paramètres et après une mise à jour. Le support Supertext voit ainsi quelle version vous utilisez. Aucun contenu, aucune clé API et aucune donnée personnelle ne sont transmis."
PLG_SYSTEM_SUPERTEXT_VERSION_REPORTS_ENV_OFF="Désactivé sur ce serveur par la variable d'environnement SUPERTEXT_VERSION_REPORTS=%s : rien n'est envoyé, quel que soit ce paramètre."
PLG_SYSTEM_SUPERTEXT_VERSION_REPORTS_ENV_ON="Activé sur ce serveur par la variable d'environnement SUPERTEXT_VERSION_REPORTS=%s, quel que soit ce paramètre."
PLG_SYSTEM_SUPERTEXT_VERSION_REPORTS_PING="Supertext vérifie que le site est joignable à l'adresse %s (la réponse ne contient que le nom du plugin)."
PLG_SYSTEM_SUPERTEXT_KEYCHECK_OK="Clé API vérifiée : la connexion à Supertext fonctionne."
PLG_SYSTEM_SUPERTEXT_KEYCHECK_INVALID="Supertext a refusé la clé API. Vérifiez que vous avez copié la clé entière ou générez-en une nouvelle sur <a href='https://www.supertext.com/en/integrations/api' target='_blank' rel='noopener'>supertext.com → Integrations → API</a> (rôle Admin requis). Pas encore de compte Supertext ? Créez-en un sur <a href='https://www.supertext.com/person/en/account/signin' target='_blank' rel='noopener'>supertext.com</a>."
PLG_SYSTEM_SUPERTEXT_KEYCHECK_MISSING="Aucune clé API n'est encore saisie. Pas encore de compte Supertext ? Créez-en un sur <a href='https://www.supertext.com/person/en/account/signin' target='_blank' rel='noopener'>supertext.com</a>. Générez votre clé API sur <a href='https://www.supertext.com/en/integrations/api' target='_blank' rel='noopener'>supertext.com → Integrations → API</a> (rôle Admin requis)."
PLG_SYSTEM_SUPERTEXT_KEYCHECK_UNREACHABLE="La clé API n'a pas pu être vérifiée, car Supertext n'est pas joignable. Les paramètres sont enregistrés ; réessayez plus tard."
PLG_SYSTEM_SUPERTEXT_KEYCHECK_ERROR="La clé API n'a pas pu être vérifiée : Supertext a répondu par une erreur (%s). Les paramètres sont enregistrés ; réessayez plus tard."
PLG_SYSTEM_SUPERTEXT_KEYCHECK_CHECKED_AT="vérifiée le %s"
PLG_SYSTEM_SUPERTEXT_KEYCHECK_NOT_CHECKED="Pas encore vérifiée. Enregistrez les paramètres ou cliquez sur « Tester la connexion »."
PLG_SYSTEM_SUPERTEXT_LANGUAGE_GSW_U_SD_CHZH="suisse allemand (Zurich)"
PLG_SYSTEM_SUPERTEXT_LANGUAGE_GSW_U_SD_CHBE="suisse allemand (Berne)"
