PLG_SYSTEM_SUPERTEXT="System - Supertext Translation"
PLG_SYSTEM_SUPERTEXT_XML_DESCRIPTION="Traduit les articles dans les autres langues du site avec la traduction IA de Supertext. Ajoute un bouton <strong>Supertext</strong> à la liste des articles et à l'éditeur d'article ; les traductions sont enregistrées comme articles associés, pour relecture."

PLG_SYSTEM_SUPERTEXT_API_KEY="Clé API Supertext"
PLG_SYSTEM_SUPERTEXT_API_KEY_DESC="Pas encore de compte Supertext ? <a href='https://www.supertext.com/person/en/account/signin' target='_blank' rel='noopener'>Créez-en un sur supertext.com</a>. Générez votre clé API sur <a href='https://www.supertext.com/en/integrations/api' target='_blank' rel='noopener'>supertext.com → Integrations → API</a> (rôle Admin requis dans votre compte Supertext). Vous pouvez la coller avec ou sans le préfixe <code>Supertext-Auth-Key</code>. La variable d'environnement SUPERTEXT_API_KEY est prioritaire."
PLG_SYSTEM_SUPERTEXT_TEST_LABEL="Connexion"
PLG_SYSTEM_SUPERTEXT_TEST_BUTTON="Tester la connexion"
PLG_SYSTEM_SUPERTEXT_TEST_DESC="Vérifie la clé enregistrée. Après avoir modifié la clé, enregistrez d'abord le plugin."
PLG_SYSTEM_SUPERTEXT_TEST_OK="Connecté. La clé API fonctionne."
PLG_SYSTEM_SUPERTEXT_ENV_KEY_ACTIVE="La clé de la variable d'environnement SUPERTEXT_API_KEY est utilisée ; le champ ci-dessus est ignoré."
PLG_SYSTEM_SUPERTEXT_ENVIRONMENT="Environnement de l'API"
PLG_SYSTEM_SUPERTEXT_ENVIRONMENT_LIVE="Production"
PLG_SYSTEM_SUPERTEXT_ENVIRONMENT_STAGING="Préproduction"
PLG_SYSTEM_SUPERTEXT_ENVIRONMENT_TESTING="Test"
PLG_SYSTEM_SUPERTEXT_ENDPOINT="URL de base de l'API personnalisée"
PLG_SYSTEM_SUPERTEXT_ENDPOINT_DESC="Facultatif. Remplace l'environnement, par exemple pour un serveur de test. La variable d'environnement SUPERTEXT_API_ENDPOINT est prioritaire."
PLG_SYSTEM_SUPERTEXT_TARGET_STATE="Statut des nouvelles traductions"
PLG_SYSTEM_SUPERTEXT_TARGET_STATE_DESC="Avec « Dépublié », un rédacteur peut relire les traductions avant leur mise en ligne."
PLG_SYSTEM_SUPERTEXT_CUSTOM_FIELDS="Traduire les champs personnalisés"
PLG_SYSTEM_SUPERTEXT_CUSTOM_FIELDS_DESC="Traduit les champs personnalisés de type Texte, Zone de texte et Éditeur. Les autres champs personnalisés sont copiés tels quels."
PLG_SYSTEM_SUPERTEXT_FIELDSET_LANGUAGES="Langues"
PLG_SYSTEM_SUPERTEXT_FIELDSET_LANGUAGES_DESC="Facultatif. Par défaut, le code de chaque langue de contenu (par ex. fr-FR) est envoyé à Supertext comme langue cible. Ajoutez une ligne pour envoyer un autre code (par ex. fr-CH pour le français de Suisse) ou pour choisir un ton formel ou informel."
PLG_SYSTEM_SUPERTEXT_LANGUAGES="Paramètres des langues"
PLG_SYSTEM_SUPERTEXT_LANGUAGE_CODE="Code de langue Supertext"
