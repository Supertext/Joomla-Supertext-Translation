<VirtualHost *:80>
    DocumentRoot /var/www/joomla
    # Railway terminates TLS: tell Joomla the request was https, so its site URL is https://.
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
    <Directory /var/www/joomla>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
